name: CI

on:
  push:
    branches: [main]
  pull_request:

# npm workspaces: one root package-lock.json installs every Worker. Workers
# Builds still handles deploys; this gate runs *before* that, so a red test
# blocks the merge.
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
        env:
          HUSKY: "0"
      - run: npm run fmt:check

  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
        env:
          HUSKY: "0"
      - run: npm -w hackbox-relay run type-check
      - run: npm -w hackbox-relay test

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
        env:
          HUSKY: "0"
      - run: npm -w hackbox-api run type-check
      - run: npm -w hackbox-api test

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
        env:
          HUSKY: "0"
      - run: npm -w hackbox-client run type-check
      - run: npm -w hackbox-client test

  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      # `npm ci` runs the workspace's postinstall `nuxt prepare`, generating
      # admin/.nuxt/tsconfig, which both the type-check and the test transform
      # resolve against.
      - run: npm ci
        env:
          HUSKY: "0"
      - run: npm -w hackbox-admin run type-check
      - run: npm -w hackbox-admin test
