name = "hackbox-api"
main = "src/index.ts"
compatibility_date = "2026-04-09"
workers_dev = true
preview_urls = true

# Workers Builds installs from the repo root (root directory `/`, one
# package-lock.json for every workspace), so no [build] step is needed here —
# wrangler bundles `main` directly. Deploy and preview commands pass
# `-c api/wrangler.toml`.

# Serve the HTTP API under the apex at hackbox.ca/api/* — a path prefix, not an
# `api.` subdomain (subdomains get reset by some users' SNI-filtering middleboxes).
# Routes alongside the relay (hackbox.ca/r/*) and the client (apex catch-all).
routes = [{ pattern = "hackbox.ca/api/*", zone_name = "hackbox.ca" }]

# Service binding to the relay Worker. The api Worker calls the relay's HTTP
# surface (/r/<code> and /r/<code>/init) to allocate and probe rooms; all
# room state lives in the relay's Durable Objects.
[[services]]
binding = "RELAY"
service = "hackbox-relay"

# Worker Previews inherit no vars or bindings. There is no RELAY service
# binding here: a Preview's service bindings reach the production relay, so a
# preview api calls its branch's relay Preview over HTTPS instead
# (previewRelay in src/relay.ts).
[previews.vars]
ENVIRONMENT = "preview"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
