name = "hackbox-client"
main = "worker/index.js"
compatibility_date = "2026-04-09"
workers_dev = true
preview_urls = true
# Worker Previews need a previews block. The client has no bindings
# to restate, and [assets] and [build] apply to Previews as they are.
previews = {}

# Serve the SPA from the apex as a Custom Domain (auto-managed DNS + cert, and it
# survives Worker renames). The api (hackbox.ca/api/*) and relay (hackbox.ca/r/*)
# routes are more specific and take precedence, so this catch-all serves only the
# SPA for everything else.
routes = [{ pattern = "hackbox.ca", custom_domain = true }]

# Build the SPA before deploying. `build-only` skips the vue-tsc type-check to
# keep deploys fast. Output lands in client/dist, which [assets] below points
# at. wrangler runs [build] from the invocation directory (the repo root in
# Workers Builds) but resolves [assets] relative to this file, so the command
# targets the workspace explicitly.
[build]
command = "npm -w hackbox-client run build-only"

# Vite's default output directory. `npm run build-only` also prerenders the
# lobby into index.html and writes the empty SPA shell to 200.html.
[assets]
directory = "./dist"
binding = "ASSETS"
# No not_found_handling: unmatched paths fall through to worker/index.js, which
# answers them with the SPA shell. Cloudflare's "single-page-application" mode
# would serve /index.html, which is the prerendered lobby.
not_found_handling = "none"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
